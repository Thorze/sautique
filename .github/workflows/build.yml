name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (si configurée)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sautique.jks"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/sautique.jks"
              echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          SCORES_URL: ${{ secrets.SCORES_URL }}
          SCORES_KEY: ${{ secrets.SCORES_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew testGithubDebugUnitTest assembleGithubDebug assembleGithubRelease bundlePlayRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sautique-apk
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
