<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Sautique</title>
  <meta name="description" content="Maintiens appuyé pour sauter de plateforme en plateforme.">
  <meta name="theme-color" content="#FDE2C8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sautique">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" aria-label="Sautique, jeu de saut"></canvas>
  <div id="safe-probe"></div>

  <div id="pseudo-dialog" role="dialog" aria-modal="true" aria-labelledby="pseudo-title">
    <form id="pseudo-form" class="card">
      <h2 id="pseudo-title">Choisis ton pseudo</h2>
      <p id="pseudo-msg"></p>
      <input id="pseudo-input" maxlength="16" autocomplete="nickname" autocapitalize="off" spellcheck="false" placeholder="Ton pseudo">
      <div class="actions">
        <button type="button" id="pseudo-cancel" class="secondary">Annuler</button>
        <button type="submit">OK</button>
      </div>
    </form>
  </div>

  <div id="error-box">
    <div class="card">
      <h2>Oups, un problème</h2>
      <p>Fais une capture d'écran de ce message et envoie-la pour que le bug soit corrigé.</p>
      <pre id="error-text"></pre>
      <div class="actions"><button type="button" onclick="location.reload()">Recharger</button></div>
    </div>
  </div>

  <script src="js/errors.js"></script>
  <script src="js/gfx.js"></script>
  <script src="js/data.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/bonus.js"></script>
  <script src="js/character.js"></script>
  <script src="js/specials.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/net.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
